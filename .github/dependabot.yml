# Once a week, Dependabot opens a pull request that moves the libraries named in pyproject.toml to their newest
# releases. It opens another for the steps the workflows use. Each takes only releases that have been out for 7 days.
# A maintainer reads each pull request and merges it. Nothing merges on its own. CONTRIBUTING.md says more.

version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7  # the same wait as exclude-newer in pyproject.toml
    # Only uv.lock changes. The version ranges in pyproject.toml, which an install of yardstick-predict follows, stay
    # as they are.
    versioning-strategy: lockfile-only
    groups:
      libraries:
        patterns: ["*"]  # every library in one pull request
    open-pull-requests-limit: 2

  - package-ecosystem: github-actions
    directory: /  # the workflows in .github/workflows
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      workflow-steps:
        patterns: ["*"]  # every step in one pull request
    open-pull-requests-limit: 2
