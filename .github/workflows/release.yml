name: Release

# Pushing a version tag, such as v0.4.0, builds the package and publishes it on PyPI. Nothing else starts this
# workflow: not pull requests, and not pushes to a branch. CONTRIBUTING.md says how to release, and what to set up
# on PyPI once. It publishes only when the tests pass on the tagged commit and the built wheel installs and runs.
# No job uses uv's cache. A cache carries files from one run to the next. One that another run saved could slip
# something into the package.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: Build the package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false  # the build needs no access to GitHub
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa  # v10.3.1
        with:
          enable-cache: false  # build from fresh downloads only
      - name: Check that the tag matches the version
        run: |
          version="$(uv version --short)"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::The tag is $GITHUB_REF_NAME, but pyproject.toml says the version is $version. Tag the commit that sets the version you mean to release."
            exit 1
          fi
          if ! grep -qxF "__version__ = \"$version\"" src/yardstick_predict/__init__.py; then
            echo "::error::src/yardstick_predict/__init__.py doesn't say version $version. Set the same version there as in pyproject.toml."
            exit 1
          fi
      - name: Build the source package and the wheel
        run: uv build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: package
          path: dist/
          if-no-files-found: error

  test:
    name: Tests on the tagged commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false  # the tests need no access to GitHub
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa  # v10.3.1
        with:
          python-version: "3.12"
          enable-cache: false  # test with fresh downloads only
      - name: Install
        run: uv sync --locked
      - name: Style
        run: |
          uv run ruff check src tests
          uv run ruff format --check src tests
      - name: Tests
        run: uv run pytest -q

  try:
    name: Install the wheel and run it
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: package
          path: dist/
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa  # v10.3.1
        with:
          enable-cache: false  # install from fresh downloads only
      - name: Install it the way a user would, with nothing else installed
        run: |
          uv tool install dist/*.whl
          shown="$(yardstick-predict --version)"
          if [ "$shown" != "yardstick-predict ${GITHUB_REF_NAME#v}" ]; then
            echo "::error::The installed command says $shown, not the version of the tag $GITHUB_REF_NAME."
            exit 1
          fi
          yardstick-predict status

  publish:
    name: Publish on PyPI
    needs: [build, test, try]
    runs-on: ubuntu-latest
    # PyPI trusts uploads from this repository, this workflow and this environment, so no password or token is kept
    # anywhere. Only this job gets the proof of where it runs, and it builds nothing, so no build code can use it.
    environment:
      name: pypi
      url: https://pypi.org/project/yardstick-predict/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: package
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
