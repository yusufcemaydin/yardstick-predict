name: Security scan

# Checks every library uv.lock pins against OSV, the public database of known vulnerabilities. It runs on each pull
# request and each push to main. It runs once a week too, since a vulnerability can be found in an old release.
# CONTRIBUTING.md says how to run it on your own computer.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"  # Mondays at 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Known vulnerabilities in the locked libraries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false  # the scan needs no access to GitHub
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          version: "0.11.6"  # uv's audit is new, so its version is fixed until a newer one is tried
      - name: Check the locked libraries
        run: uv audit --locked --preview-features audit
