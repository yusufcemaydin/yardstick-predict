[project]
name = "yardstick-predict"
version = "0.3.0"
description = "Forecast how long a coding-agent task will take and what it will cost, before it runs."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "yusufcemaydin" }]
requires-python = ">=3.12"
keywords = ["claude-code", "codex", "coding-agents", "forecasting", "tokens", "cost", "orchestration"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development",
]
dependencies = [
    "numpy>=1.26",
    # XGBoost's main package carries a large NVIDIA library on Linux and Windows. xgboost-cpu is the same
    # library without it. On a Mac there is only the main package, and it has no NVIDIA part.
    "xgboost>=3.4,<4; sys_platform == 'darwin'",
    "xgboost-cpu>=3.4,<4; sys_platform != 'darwin'",
    "tokenizers>=0.19",
    "keyring>=24",
    # On a Mac, XGBoost needs OpenMP. scikit-learn ships a copy, so nothing else has to be installed.
    "scikit-learn>=1.3; sys_platform == 'darwin'",
]

[project.optional-dependencies]
# Only for LLM analysis paid with an API key: the providers' own official libraries. A subscription uses the
# Claude Code or Codex command already on your computer and needs neither.
llm = [
    "anthropic>=1.12,<2",
    "openai>=3.26,<4",
]

[project.urls]
Homepage = "https://github.com/yusufcemaydin/yardstick-predict"
Issues = "https://github.com/yusufcemaydin/yardstick-predict/issues"

[project.scripts]
yardstick-predict = "yardstick_predict.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "jsonschema>=4.20",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yardstick_predict"]

# Only these files go in the source package. Anything else in the folder, ignored by git or not, stays out.
[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/docs", "/schemas", "/README.md", "/LICENSE", "/CONTRIBUTING.md", "/SECURITY.md", "/uv.lock"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B905"]
